<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects · Gopika Jaideep</title>
<meta name="description" content="Gopika Jaideep's projects: LLM agents, RAG systems and ML models, with architecture diagrams, risk levels and links.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap">
<script>try { const t = localStorage.getItem('gj-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="assets/site.css?v=55">
<style>
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.p { position: relative; display: grid; gap: 14px; align-content: start; padding: 22px; border-radius: 18px; background: var(--sheet); border: 1px solid var(--rule); transition: transform .35s var(--ease), border-color .2s, opacity .3s; min-width: 0; }
.card-pol { position: absolute; right: 16px; top: -18px; width: 168px; --r: 5deg; z-index: 2; }
.card-pol figcaption { font-size: 15px; }
@media (min-width: 1101px) { .p:has(.card-pol) > .top, .p:has(.card-pol) > h2, .p:has(.card-pol) > .one { padding-right: 180px; } }
@media (max-width: 1100px) { .card-pol { position: static; justify-self: center; width: min(260px, 80%); order: -1; margin-top: -6px; } }
.p:hover { transform: translateY(-4px); border-color: var(--ink); }
.p.big { grid-column: 1 / -1; }
.p.out { display: none; }
.p.enter { animation: penter .45s var(--ease); }
@keyframes penter { from { transform: scale(.96) translateY(10px); opacity: 0; } }
.p .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.p h2 { font-size: clamp(28px, 3.2vw, 38px); }
.p .one { margin: -6px 0 0; color: var(--ink-2); }
.arch { border-radius: 14px; background: var(--paper); border: 1px solid var(--rule); padding: 10px; }
.arch svg { display: block; width: 100%; height: auto; }
.arch .n rect { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.4; }
.arch .n.hl rect { fill: var(--accent-soft); stroke: var(--accent); }
.arch .n.warn rect { stroke: var(--signal); stroke-dasharray: 4 3; }
.arch .n text { font: 600 12px var(--body); fill: var(--ink); }
.arch .e { stroke: var(--rule); stroke-width: 1.6; fill: none; }
.arch .dot { fill: var(--accent); }
.metrics { display: flex; flex-wrap: wrap; gap: 8px; }
.metric { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
.metric b { font: 800 20px/1 var(--display); color: var(--ink); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 10px 14px; font-size: 13px; }

dialog.drawer { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(640px, 100%); border: 0; padding: 0; background: var(--paper); color: var(--ink); box-shadow: -30px 0 60px -30px rgba(0,0,0,.5); }
dialog.drawer[open] { animation: slide .4s var(--ease); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
dialog.drawer::backdrop { background: rgba(5, 10, 8, .45); backdrop-filter: blur(3px); }
.dr { padding: calc(20px + env(safe-area-inset-top, 0px)) clamp(18px, 4vw, 32px) 40px; display: grid; gap: 18px; }
.dr .x { justify-self: end; }
.dr h2 { font-size: clamp(32px, 5vw, 48px); }
.dr h4 { margin: 0 0 8px; font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.dr ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.dr .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 560px) { .dr .cols { grid-template-columns: minmax(0, 1fr); } }
.dr .safe li::marker { color: var(--accent); }
.dr .stack { font: 400 12.5px/1.7 var(--mono); color: var(--ink-2); }
</style>
</head>
<body data-page="projects.html">
<header id="site-bar"></header>
<main class="wrap">
  <div class="page-head">
    <h1 class="reveal d1">Projects</h1>
    <p class="lede reveal d2">Each card shows the system's architecture with live data flow, its risk level, and links to the code. <b>Open one</b> for the full story.</p>
  </div>
  <div class="filters reveal d3" role="group" aria-label="Filter projects" id="filters"></div>
  <div class="grid" id="grid"></div>
  <a class="next" href="skills.html"><div><small>NEXT · 4 / 7</small><b>Skills</b></div><span class="go">→</span></a>
</main>
<footer id="site-foot"></footer>

<dialog class="drawer" id="drawer" aria-labelledby="drTitle"><div class="dr" id="dr"></div></dialog>

<script src="assets/site.js?v=55"></script>
<script src="assets/rag-core.js?v=55"></script>
<script src="assets/buddy.js?v=55"></script>
<script>
(() => {
  const GJ = window.GJ;
  // cols: columns of nodes; each node "label" or {t, hl, warn}. Edges connect every node to every node in the next column.
  const P = [
    { id: 'carewise', name: 'CareWise', big: true, kinds: ['agents', 'rag', 'safety'], risk: ['risk', 'risk: high · users may be in crisis'],
      one: 'An AI companion for cancer caregivers: symptoms, medications, appointments and emotional support.',
      cols: [['Carer message'], [{ t: 'Intent router', hl: 1 }, { t: 'Crisis screen', warn: 1 }], ['6 agents', 'Hybrid RAG'], [{ t: 'Cited reply', hl: 1 }]],
      metrics: [['6', 'agents'], ['39+', 'tests in CI gate'], ['2', 'prod bugs found']],
      links: [['https://carewise-aibuddy.vercel.app/', 'Live app ↗'], ['https://github.com/GopikaJaideep/CareWise', 'Repository ↗']], evals: 'carewise',
      built: ['Six-agent orchestration with LLM intent routing and handoffs with cycle detection, written against the Gemini and Anthropic SDKs, no agent framework', 'Hybrid RAG (BM25 + embeddings, reciprocal rank fusion) for a cited resource guide'],
      safety: ['Layered crisis detection: keyword rules plus a parallel AI risk screen that can only add protection', 'Separate handling when a carer reports risk to someone else', 'Citations limited to sources actually retrieved', 'Eval-gated CI blocks merges on crisis or retrieval regressions', 'Degraded-state testing found and fixed two production bugs'],
      stack: 'FastAPI · Gemini · Anthropic · BM25 + embeddings · Pytest · CI/CD' },
    { id: 'traceai', name: 'TraceAI', kinds: ['safety'], risk: ['risk', 'risk: high · misuse could enable stalking'],
      one: 'Lead scoring and evidence fusion for missing-persons cases, for police and NGO caseworkers.',
      cols: [['Location', 'Recency', 'Credibility', 'Identity'], [{ t: 'Fusion engine', hl: 1 }], [{ t: 'Plausibility cut', warn: 1 }], [{ t: 'Lead score', hl: 1 }]],
      metrics: [['4/4', 'mutants caught'], ['48', 'tests']],
      links: [['https://gopikajaideep.github.io/TraceAI/', 'Demo ↗'], ['https://github.com/GopikaJaideep/TraceAI', 'Repository ↗']], evals: 'traceai',
      built: ['A four-signal fusion engine that renormalises weights when a signal is missing', 'A physical-plausibility cutoff that rejects impossible leads'],
      safety: ['Mutation-testing harness breaks access gating, attestation, honeypot and audit chain, and checks the 48-test suite catches each', 'Need-to-know access gating with indistinguishable auth-failure responses, closing a stalking vector'],
      stack: 'Python · evidence fusion · mutation testing · threat modelling' },
    { id: 'quitory', name: 'Quitory', kinds: ['agents', 'safety'], risk: ['med', 'risk: medium · health advice'],
      photo: { src: 'assets/photos/quitory.webp', cap: 'build day with the team ✌️', alt: 'Gopika and teammates at a table of laptops, one showing the Quitory app' },
      one: 'Vaping-cessation app on serverless AWS. Monash Industry Showcase, team of 3.',
      cols: [['Vue app'], ['API Gateway'], [{ t: 'Lambda × 6', hl: 1 }, { t: 'Groq + topic gate', warn: 1 }], ['RDS MySQL', 'WHO GHO API']],
      metrics: [['0%', 'unsafe on tested queries'], ['+38pp', 'vs GPT-4'], ['500+', 'red-team queries']],
      links: [['https://github.com/MinhQuan-Tran/FIT5120-Main-Frontend', 'Frontend repo ↗']], evals: 'quitory',
      built: ['Six backend modules on AWS Lambda, API Gateway and RDS MySQL', 'A Groq-backed assistant, and a hybrid rule-based + LLM health-risk calculator using the WHO Global Health Observatory API', 'Craving-trigger analytics and peak-craving-time detection; rebuilt session tracking after iteration 1', 'About and Profile views on the Vue + Capacitor mobile frontend'],
      safety: ['Keyword-gated topic scoping on the assistant', 'Best of 25 prompts picked on the training split, then one run on held-out data', 'Red-teamed with 500+ adversarial queries'],
      stack: 'AWS Lambda · API Gateway · RDS MySQL · Groq · Vue + Capacitor' },
    { id: 'photoalchemy', name: 'PhotoAlchemy', kinds: ['ml'], risk: ['med', 'risk: medium · grieving families'],
      one: 'Production photo restoration and animation for funeral directors, at Timeless Tributes AI.',
      cols: [['Old photo'], ['GFPGAN · faces'], ['Real-ESRGAN · upscale'], [{ t: 'Animate', hl: 1 }]],
      metrics: [['3', 'models chained'], ['prod', 'shipped']], links: [], evals: null,
      built: ['Restoration and animation tool built with React, Vite and the Replicate API', 'Chains GFPGAN face restoration, Real-ESRGAN upscaling and Nano Banana'],
      safety: ['Researched how families in the memorial industry react to AI-altered photos, to shape product positioning'],
      stack: 'React · Vite · Replicate · GFPGAN · Real-ESRGAN · Nano Banana' },
    { id: 'auswise', name: 'Social media analytics', kinds: ['ml'], risk: ['ok', 'AusWise · volunteer'],
      one: 'Explains what drives Instagram post performance, then writes the report.',
      cols: [['Apify scrape'], [{ t: 'XGBoost', hl: 1 }, 'BERTopic'], ['SHAP', 'Groq summary'], [{ t: 'Branded report', hl: 1 }]],
      metrics: [['7', 'people on the team']], links: [], evals: null,
      built: ['Instagram scraping through Apify', 'XGBoost model of post performance, explained with SHAP', 'BERTopic topic modelling and Groq LLM summaries into branded reports'],
      safety: ['SHAP explanations so the team can see why the model ranks a post, not just the score'],
      stack: 'Apify · XGBoost · SHAP · BERTopic · Groq' },
    { id: 'parkingspy', name: 'ParkingSpy', kinds: ['ml'], risk: ['ok', 'capstone · agile team'],
      one: 'Pipelines over 6 live data sources feeding a parking-detection model.',
      cols: [['6 live sources'], ['Data pipelines'], [{ t: 'Random Forest', hl: 1 }], ['Detection']],
      metrics: [['94.2%', 'accuracy'], ['<30 s', 'latency (was ~8 min)']], links: [], evals: 'parkingspy',
      built: ['Data pipelines over 6 live data sources', 'Random Forest model reaching 94.2% accuracy', 'Cut detection latency from about 8 minutes to under 30 seconds'],
      safety: ['Delivered in a sprint-based agile team'], stack: 'Python · Random Forest · data pipelines' },
    { id: 'nids', name: 'Intrusion detection', kinds: ['ml', 'safety'], risk: ['ok', 'B.Tech capstone'],
      one: 'Compared three models on NSL-KDD, then shipped an LSTM demo against simulated attacks.',
      cols: [['NSL-KDD'], [{ t: 'Random Forest', hl: 1 }, 'SVM', 'LSTM'], ['Compare'], ['LSTM web demo']],
      metrics: [['99.9%', 'RF accuracy'], ['3', 'models compared']], links: [], evals: 'nids',
      built: ['Compared Random Forest, SVM and LSTM on NSL-KDD (Random Forest 99.9% on a random 70/30 split)', 'LSTM web demo tested with simulated MQTT attacks'],
      safety: ['Reports the split used, since a random split can flatter accuracy', 'Tested the live demo against simulated attacks, not just a held-out set'], stack: 'Python · scikit-learn · SVM · LSTM · MQTT' },
    { id: 'aloka', name: 'ALOKA', kinds: ['ml'], risk: ['ok', 'B.Tech project · accessibility'],
      one: 'An OpenCV-based accessibility app for Android, built in Java.',
      cols: [['Camera input'], [{ t: 'OpenCV', hl: 1 }], ['Android · Java'], [{ t: 'Accessibility', hl: 1 }]],
      metrics: [['Android', 'Java app'], ['OpenCV', 'computer vision']], links: [['https://github.com/GopikaJaideep/Aloka', 'Repository ↗']], evals: null,
      built: ['An accessibility app for Android, written in Java', 'Computer vision with OpenCV'],
      safety: ['Part of my B.Tech final-year work, alongside the intrusion detection project'], stack: 'Java · Android · OpenCV' },
  ];
  const KINDS = [['all', 'All'], ['agents', 'Agents'], ['rag', 'RAG'], ['ml', 'ML models'], ['safety', 'Safety-critical']];

  // ---------- architecture diagram ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function diagram(cols, key) {
    const W = 640, colW = 128, gap = (W - colW * cols.length) / (cols.length - 1), nodeH = 34, vgap = 12;
    const maxN = Math.max(...cols.map(c => c.length)), H = maxN * nodeH + (maxN - 1) * vgap + 20;
    const pos = cols.map((c, i) => c.map((n, j) => { const tot = c.length * nodeH + (c.length - 1) * vgap; return { x: i * (colW + gap), y: (H - tot) / 2 + j * (nodeH + vgap), n: typeof n === 'string' ? { t: n } : n }; }));
    let edges = '', dots = '', nodes = '', k = 0;
    for (let i = 0; i < pos.length - 1; i++) pos[i].forEach(a => pos[i + 1].forEach(b => {
      const x1 = a.x + colW, y1 = a.y + nodeH / 2, x2 = b.x, y2 = b.y + nodeH / 2, mx = (x1 + x2) / 2;
      const d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`, id = `${key}-e${k++}`;
      edges += `<path class="e" id="${id}" d="${d}"/>`;
      if (!GJ.reduce) dots += `<circle class="dot" r="3.5"><animateMotion dur="${(1.6 + (k % 3) * .35).toFixed(2)}s" begin="${(i * .45 + (k % 4) * .2).toFixed(2)}s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>`;
    }));
    pos.flat().forEach(p => { nodes += `<g class="n${p.n.hl ? ' hl' : ''}${p.n.warn ? ' warn' : ''}"><rect x="${p.x}" y="${p.y}" width="${colW}" height="${nodeH}" rx="9"/><text x="${p.x + colW / 2}" y="${p.y + nodeH / 2 + 4}" text-anchor="middle">${esc(p.n.t)}</text></g>`; });
    return `<svg viewBox="-2 0 ${W + 4} ${H}" role="img" aria-label="Architecture: ${esc(cols.map(c => c.map(n => n.t || n).join(' / ')).join(' → '))}">${edges}${dots}${nodes}</svg>`;
  }

  // ---------- cards ----------
  const grid = document.getElementById('grid');
  grid.innerHTML = P.map((p, i) => `<article class="p reveal${p.big ? ' big' : ''}" id="${p.id}" data-kinds="${p.kinds.join(' ')}">
      ${p.photo ? `<figure class="polaroid card-pol" tabindex="0" role="button" aria-label="Open photo: ${p.photo.cap}"><span class="tape"></span><img src="${p.photo.src}" alt="${p.photo.alt}" loading="lazy" style="--ar:4/3"><figcaption>${p.photo.cap}</figcaption></figure>` : ''}
      <div class="top"><span class="tag ${p.risk[0]}"><span class="dot"></span>${p.risk[1]}</span>${p.kinds.map(k => `<span class="tag">${KINDS.find(x => x[0] === k)[1]}</span>`).join('')}</div>
      <h2>${p.name}</h2><p class="one">${p.one}</p>
      <div class="arch">${diagram(p.cols, p.id)}</div>
      <div class="metrics">${p.metrics.map(([v, k]) => `<span class="metric"><b>${v}</b>${k}</span>`).join('')}</div>
      <div class="acts"><button class="btn solid" type="button" data-open="${p.id}">Details <span class="arr">→</span></button>
        ${p.links.map(([h, l]) => `<a class="btn" href="${h}" target="_blank" rel="noopener">${l}</a>`).join('')}
        ${p.evals ? `<a class="btn" href="evals.html#${p.evals}">Evals ↗</a>` : ''}</div>
    </article>`).join('');
  GJ.watch(grid);

  // ---------- filters ----------
  const fbox = document.getElementById('filters');
  fbox.innerHTML = KINDS.map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === 'all'}">${l}<span class="n">${k === 'all' ? P.length : P.filter(p => p.kinds.includes(k)).length}</span></button>`).join('');
  fbox.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    fbox.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    grid.querySelectorAll('.p').forEach(card => {
      const show = c.dataset.k === 'all' || card.dataset.kinds.split(' ').includes(c.dataset.k);
      const was = !card.classList.contains('out');
      card.classList.toggle('out', !show);
      card.classList.toggle('big', show && c.dataset.k === 'all' && card.id === 'carewise');
      if (show && !was) { card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }
    });
  });

  // ---------- drawer ----------
  const dlg = document.getElementById('drawer'), dr = document.getElementById('dr');
  function open(id) {
    const p = P.find(x => x.id === id); if (!p) return;
    dr.innerHTML = `<button class="btn x" type="button" id="drClose" aria-label="Close">Close ✕</button>
      <div class="top" style="display:flex;flex-wrap:wrap;gap:8px"><span class="tag ${p.risk[0]}"><span class="dot"></span>${p.risk[1]}</span></div>
      <h2 id="drTitle">${p.name}</h2><p class="lede" style="margin-top:-8px">${p.one}</p>
      <div class="arch">${diagram(p.cols, p.id + '-d')}</div>
      <div class="metrics">${p.metrics.map(([v, k]) => `<span class="metric"><b>${v}</b>${k}</span>`).join('')}</div>
      <div class="cols"><div><h4>What I built</h4><ul>${p.built.map(x => `<li>${x}</li>`).join('')}</ul></div>
        <div class="safe"><h4>Safety & quality</h4><ul>${p.safety.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
      <div class="stack">${p.stack}</div>
      <div class="acts">${p.links.map(([h, l]) => `<a class="btn" href="${h}" target="_blank" rel="noopener">${l}</a>`).join('')}${p.evals ? `<a class="btn solid" href="evals.html#${p.evals}">See the evals <span class="arr">→</span></a>` : ''}</div>`;
    dr.querySelector('#drClose').addEventListener('click', () => dlg.close());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  grid.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) open(b.dataset.open); });
  // deep link: projects.html#quitory opens that project
  const h = location.hash.slice(1);
  if (h && P.some(p => p.id === h)) setTimeout(() => { document.getElementById(h).scrollIntoView({ block: 'center' }); open(h); }, 250);
})();
</script>
</body>
</html>
